name: equishare_flutter
description: "EQUISHARE: alquiler y préstamo de equipos entre empresas de Trujillo (versión Flutter para Android y web)."
publish_to: 'none'
version: 0.16.0+16

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase (Authentication y Cloud Firestore)
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0

  # Google Maps y ubicación
  google_maps_flutter: ^2.12.0
  geolocator: ^14.0.0

  # API REST, persistencia local, fotos y MVVM
  http: ^1.2.0
  hive_ce: ^2.11.0
  hive_ce_flutter: ^2.3.0
  image_picker: ^1.1.2
  provider: ^6.1.2
  connectivity_plus: ^7.3.1
  geocoding: 5.0.1
  google_mlkit_image_labeling: ^1.0.1
  google_mlkit_text_recognition: ^1.0.1
  http_parser: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
